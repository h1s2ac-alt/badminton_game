<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wii Badminton</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }
    #swing-btn {
      position: absolute;
      bottom: 24px;
      right: 28px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #60A5FA, #2563EB 70%, #1D4ED8);
      border: 3px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-family: inherit;
      cursor: pointer;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    #swing-btn:hover {
      filter: brightness(1.1);
    }
    #swing-btn:active {
      transform: scale(0.92);
      filter: brightness(0.95);
    }
    .btn-icon {
      font-size: 24px;
      line-height: 1;
    }
    .btn-text {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
    .btn-sub {
      font-size: 9px;
      font-weight: 700;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
    <canvas id="game-canvas"></canvas>
    <button id="swing-btn" title="Click or Press Space to Swing">
      <span class="btn-icon">🏸</span>
      <span class="btn-text">SWING</span>
      <span class="btn-sub">[SPACE]</span>
    </button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
